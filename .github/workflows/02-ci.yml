
name: CI

on: [push, pull_request]

jobs:
  lint:
    name: Lint - Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Retrieve code
        uses: actions/checkout@v4

      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check code style
        run: ruff check .

  build:
    name: Build - Verify application
    runs-on: ubuntu-latest

    steps:
      - name: Retrieve code
        uses: actions/checkout@v4

      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile code
        run: python -m compileall app

      - name: Import application
        run: python -c "from app.main import app; print(app.title)"

  test:
    name: Test - Pytest
    needs: [lint, build]
    runs-on: ubuntu-latest

    steps:
      - name: Retrieve code
        uses: actions/checkout@v4

      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Display GitHub contexts
        env:
          APP_NAME: fastapi-starter
        run: |
          echo "Application: $APP_NAME"
          echo "Actor: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Runner OS: ${{ runner.os }}"
          echo "Head ref: ${{ github.head_ref }}"
          echo "Base ref: ${{ github.base_ref }}"

      - name: Display full GitHub JSON
        env:
          GITHUB_CONTEXT_JSON: ${{ toJson(github) }}
        run: |
          printf '%s\n' "$GITHUB_CONTEXT_JSON"
