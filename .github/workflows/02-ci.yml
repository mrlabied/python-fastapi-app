
name: CI

on: [push, pull_request]

jobs:

  lint:
    name: Lint v– Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Vérifier le style
        run: ruff check .

  build:
    name: Build – Vérifier l'application
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Compiler le code
        run: python -m compileall app

      - name: Importer l’application
        run: python -c "from app.main import app; print(app.title)"

      - name: Afficher les informations de l'environnement
        run: |
          echo "Application: ${{ env.APP_NAME }}"
          echo "Acteur: ${{ github.actor }}"
          echo "Événement: ${{ github.event_name }}"
          echo "Branche: ${{ github.ref_name }}"
          echo "SHA: ${{ github.sha }}"
          echo "OS: ${{ runner.os }}"

      - name: Afficher toutes les informations GitHub
        run: echo '${{ toJson(github) }}'

  test:
    name: Test – Pytest
    needs: [lint, build]
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Exécuter les tests
        run: pytest

env:
  APP_NAME: python-fastapi-starter