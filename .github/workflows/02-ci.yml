
name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint – Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dépendances
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Vérifier le style
        run: ruff check .

      - name: Afficher les contextes
        env:
          APP_NAME: fastapi-starter
        run: |
          echo "Application : $APP_NAME"
          echo "Acteur : ${{ github.actor }}"
          echo "Evenement : ${{ github.event_name }}"
          echo "Branche : ${{ github.ref_name }}"
          echo "SHA : ${{ github.sha }}"
          echo "OS : ${{ runner.os }}"

      - name: Afficher le contexte GitHub
        run: echo '${{ toJson(github) }}'

  build:
    name: Build – Vérifier l’application
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dépendances
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Compiler le code
        run: python -m compileall app

      - name: Importer l’application
        run: python -c "from app.main import app; print(app.title)"

  test:
    name: Test – Pytest
    needs: [lint, build]
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installer les dépendances
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Exécuter les tests
        run: pytest
